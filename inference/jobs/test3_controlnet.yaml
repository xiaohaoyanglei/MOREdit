model:
  config: pointer_lora/pointer_lora_config.yaml
  lora_weights: /root/autodl-tmp/pointer_lora/output/20251201-141737/weights/lora_step_008000.pt
  refiner_weights: null

inference:
  image: /root/autodl-tmp/test_images/test4.png
  pointer_prompt: "the first person from the right"
  # 使用 ControlNet Inpainting：prompt 只描述要改什么，无需重复位置信息
  # ControlNet 会根据 mask 精确控制编辑区域
  edit_prompt: "In the same anime style, change the person's outfit to a blue suit. Keep the face and identity unchanged."

  # Qwen ControlNet Inpainting 配置
  edit_backend: qwen
  qwen_mode: inpaint  # 使用 inpaint 模式以启用 ControlNet
  qwen_controlnet_path: /root/autodl-tmp/Qwen-Image-ControlNet-Inpainting  # ControlNet 模型路径
  qwen_strength: 0.8  # inpaint 强度（仅 inpaint 模式有效）

  negative_prompt: "blurry face, deformed face, low detail, bad anatomy, low quality"

  # Mask 生成策略
  mask_mode: peak_region
  peak_region_threshold: 0.3
  peak_region_threshold_mode: rel
  peak_region_connectivity: 8
  peak_region_max_iters: 2048

  # Mask 处理参数
  mask_feather: 8.0  # mask 羽化半径
  mask_dilate: 16    # mask 膨胀像素（扩大 mask 范围）

  # Kontext 相关参数（当使用 ControlNet 时这些参数影响较小）
  latent_inpaint_strength: 1.0
  latent_blend_alpha: 0.0  # 使用 ControlNet 时可以关闭 latent blending
  conditioning_masked_image: false  # ControlNet 自己处理 mask
  use_inpaint_pipeline: false  # 使用 Qwen ControlNet 而非 Kontext Inpaint

  # 推理参数
  width: null   # null = 使用原图尺寸（自动对齐到16的倍数）
  height: null
  steps: 30     # ControlNet 推荐 30-50 步
  guidance_scale: 4.0
  true_cfg_scale: 4.0
  seed: 42

  # 输出目录
  output_dir: pointer_lora/output/controlnet_demo

  # Crop 编辑参数（可选，用于进一步减少改错人的风险）
  crop_edit: false
  crop_pad: 48
  crop_feather: 2.0
  crop_paste_mode: mask
  crop_dilate: 20
  crop_alpha_gamma: 0.75
