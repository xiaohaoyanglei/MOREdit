model:
  config: /workspace/MOREdit/pointer_lora_config.yaml
  lora_weights: /workspace/lora_step_007000.pt
  refiner_weights: null

inference:
  image: /workspace/test3.png
  pointer_prompt: "the third person from the right"
  edit_prompt: "In the same anime style, change the person's outfit to a blue suit. Keep the face and identity unchanged."

  edit_backend: qwen
  qwen_mode: inpaint
  qwen_controlnet_path: /workspace/models/Qwen-Image-ControlNet-Inpainting
  qwen_strength: 0.8

  negative_prompt: "blurry face, deformed face, low detail, bad anatomy, low quality"

  mask_mode: peak_region
  peak_region_threshold: 0.3
  peak_region_threshold_mode: rel
  peak_region_connectivity: 8
  peak_region_max_iters: 2048

  mask_feather: 8.0
  mask_dilate: 16

  latent_inpaint_strength: 1.0
  latent_blend_alpha: 0.0
  conditioning_masked_image: false
  use_inpaint_pipeline: false

  # CPU 快速验证参数
  width: 512
  height: 208
  steps: 4
  guidance_scale: 3.5
  true_cfg_scale: 3.5
  seed: 42

  output_dir: /workspace/MOREdit/output/controlnet_demo_cpu_quick

  crop_edit: false
  crop_pad: 48
  crop_feather: 2.0
  crop_paste_mode: mask
  crop_dilate: 20
  crop_alpha_gamma: 0.75
